spring.application.name=stg-guideme-be
server.port=8080

# Azure AD / Entra ID
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.profile.tenant-id=${TENANT_ID}
spring.cloud.azure.active-directory.credential.client-id=${CLIENT_ID}
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${TENANT_ID}/v2.0

#database
spring.datasource.url=jdbc:postgresql://localhost:5446/postgres?currentSchema=guideme
spring.datasource.username=user
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=create-drop

#data seeding
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:sql/data.sql
spring.sql.init.mode=always

frontend.url=${FRONTEND_URL}