spring.application.name=stg-guideme-be
server.port=8080
spring.config.import=optional:aws-secretsmanager:stg-guide-me-env

# Azure AD / Entra ID
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.profile.tenant-id=${TENANT_ID}
spring.cloud.azure.active-directory.credential.client-id=${CLIENT_ID}
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${TENANT_ID}/v2.0

#database
spring.datasource.url=jdbc:postgresql://${DATASOURCE_HOST}:${DATASOURCE_PORT}/${DATASOURCE_DATABASE}?currentSchema=guideme
spring.datasource.username=${DATASOURCE_USER}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4
spring.jpa.hibernate.ddl-auto=create-drop

#data seeding
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:sql/data.sql
spring.sql.init.mode=never

frontend.url=${FRONTEND_URL}
resend.api.key=${RESEND_API_KEY}

#aws
aws.s3.access.key=${AWS_S3_ACCESS_KEY}
aws.s3.secret.key=${AWS_S3_SECRET_KEY}
aws.s3.bucket=${AWS_S3_BUCKET}
aws.region=${AWS_REGION}